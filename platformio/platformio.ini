[platformio]
default_envs = vetronic_rs485_sd

[common]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
extra_scripts = pre:scripts/framework_deps.py

[env:vetronic_rs485]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
extra_scripts = ${common.extra_scripts}
build_src_filter = -<*> +<rs485/>
build_flags = -Isrc/rs485

[env:vetronic_rs485_sd]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
extra_scripts = ${common.extra_scripts}
build_src_filter = -<*> +<rs485_sd/>
build_flags = -Isrc/rs485_sd
